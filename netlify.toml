# Configuración de Netlify para el front de movi-info.
#
# Netlify sirve únicamente el resultado estático de "vite build". No ejecuta nada del proyecto
# en su lado (no hay SSR ni funciones), que es la diferencia de fondo con un despliegue de Next.js.
#
# El despliegue lo hace GitHub Actions con netlify-cli (ver .github/workflows/ci.yml), no la
# integración con Git de Netlify. Por eso el proxy de /api/*, el fallback de SPA y las cabeceras
# NO están aquí, sino en front-react/public/_redirects y front-react/public/_headers: al no
# construir Netlify el proyecto, lo único que lee son los ficheros que se publican.
#
# El bloque de abajo queda como documentación de cómo se construye el front, y para que la
# integración con Git siguiera funcionando si algún día se enlazara el repositorio.

[build]
  base = "front-react"
  command = "npm run build"
  # Relativo al directorio "base", es decir: front-react/dist
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La URL del back no se define aquí: la fija front-react/.env.production, que Vite carga solo al
# construir en modo producción. Así el valor es el mismo se construya donde se construya.
